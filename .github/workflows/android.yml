name: Build WattAI Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android builder
        run: npm install -g @bubblewrap/cli

      - name: Initialize Android project
        run: bubblewrap init --manifest twa-manifest.json

      - name: Build Android App Bundle
        run: bubblewrap build
